<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        :root {
            --bg-canvas: #0f172a;
            --bg-card: #1e293b;
            --bg-user: #2563eb;
            --bg-bot: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-canvas);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .app-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        header {
            padding: 1rem 1.5rem;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(8px);
        }
        header h1 {
            font-size: 1.25rem;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }
        header p {
            font-size: 0.85rem;
            color: var(--text-sub);
        }
        .chat-stream {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .bubble {
            max-width: 80%;
            padding: 0.85rem 1.15rem;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .bubble.user {
            align-self: flex-end;
            background: var(--bg-user);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }
        .bubble.bot {
            align-self: flex-start;
            background: var(--bg-bot);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .typing-dots {
            display: inline-flex;
            gap: 4px;
            padding: 4px 8px;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-sub);
            border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }
        footer {
            padding: 1rem 1.5rem;
            background: rgba(15, 23, 42, 0.6);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.75rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.85rem 1rem;
            background: #0f172a;
            border: 1px solid var(--border);
            color: #ffffff;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
        }
        input[type="text"]:focus {
            border-color: var(--accent);
        }
        button {
            padding: 0 1.5rem;
            background: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>{{ title }}</h1>
            <p>Domain Scope: {{ allowed_topics }}</p>
        </header>

        <div class="chat-stream" id="chatStream">
            <div class="bubble bot">Welcome! I am your {{ domain_name }}. How can I assist you today?</div>
        </div>

        <footer>
            <input type="text" id="userInput" placeholder="Type your query here..." autocomplete="off" />
            <button id="sendBtn">Send</button>
        </footer>
    </div>

    <script>
        const chatStream = document.getElementById("chatStream");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");

        let conversationHistory = [];

        function appendBubble(role, text) {
            const div = document.createElement("div");
            div.className = `bubble ${role}`;
            div.textContent = text;
            chatStream.appendChild(div);
            chatStream.scrollTop = chatStream.scrollHeight;
            return div;
        }

        async function handleSend() {
            const message = userInput.value.trim();
            if (!message) return;

            appendBubble("user", message);
            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;

            const loader = document.createElement("div");
            loader.className = "bubble bot";
            loader.innerHTML = '<div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
            chatStream.appendChild(loader);
            chatStream.scrollTop = chatStream.scrollHeight;

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: jsonString({ message, history: conversationHistory })
                });

                const data = await res.json();
                loader.remove();

                const reply = data.reply || "No reply available.";
                appendBubble("bot", reply);

                conversationHistory.push({ role: "user", parts: [message] });
                conversationHistory.push({ role: "model", parts: [reply] });

            } catch (err) {
                loader.remove();
                appendBubble("bot", "Network communication error. Please try again.");
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function jsonString(obj) {
            return JSON.stringify(obj);
        }

        sendBtn.addEventListener("click", handleSend);
        userInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") handleSend();
        });
    </script>
</body>
</html>
